name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Lint (type-check)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Nomenclature table is reproducible
        run: |
          python3 birss-tables/tools/generate_nomenclature.py
          git diff --exit-code birss-tables/table-nomenclature.md
      - name: Test
        run: npm run test
