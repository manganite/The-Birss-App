name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (type-check)
        run: npm run lint
      - name: Lint (ESLint)
        run: npm run lint:eslint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Nomenclature table is reproducible
        run: npm run check:nomenclature
      - name: Test
        run: npm run test
